name: Reference motion QA

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Shadow Dance
        uses: actions/checkout@v4

      - name: Check out pinned GR00T Whole-Body Control
        uses: actions/checkout@v4
        with:
          repository: NVlabs/GR00T-WholeBodyControl
          ref: c374bae5b9039cd0ee71377e654d11ce1bc69e1d
          path: external/GR00T-WholeBodyControl
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reference toolchain
        run: python -m pip install -e ".[dev]"

      - name: Lint and test
        env:
          SONIC_ROOT: ${{ github.workspace }}/external/GR00T-WholeBodyControl
        run: |
          ruff check src scripts tests
          pytest -q

      - name: Verify active-runtime G1 asset hydration
        env:
          QA_ROOT: ${{ runner.temp }}/shadow-qa
        run: |
          python scripts/hydrate_sonic_assets.py \
            --sonic-root "$QA_ROOT/runtime-sonic" \
            --report "$QA_ROOT/sonic-assets.json"

      - name: Regenerate and validate the complete v2 set
        env:
          QA_ROOT: ${{ runner.temp }}/shadow-qa
          SONIC_ROOT: ${{ github.workspace }}/external/GR00T-WholeBodyControl
        run: |
          shadow-generate --profile dance-v2 \
            --sonic-root "$SONIC_ROOT" \
            --output "$QA_ROOT/generated-v2" \
            --manifest "$QA_ROOT/manifests/shadow-dance-v2.json" \
            --splits "$QA_ROOT/splits-v2"
          shadow-validate \
            --sonic-root "$SONIC_ROOT" \
            --dataset "$QA_ROOT/generated-v2" \
            --manifest "$QA_ROOT/manifests/shadow-dance-v2.json" \
            --report "$QA_ROOT/reference-validation-v2.json"

      - name: Prove the committed bundle is reproducible
        env:
          QA_ROOT: ${{ runner.temp }}/shadow-qa
        run: |
          # Cross-platform limits remain sub-0.01 mm / 0.001 degree in CSV units
          # and 1e-5 in the SI/radian PKL and validator fields.
          python scripts/compare_regenerated_bundle.py \
            --candidate-root "$QA_ROOT/generated-v2" \
            --candidate-manifest "$QA_ROOT/manifests/shadow-dance-v2.json" \
            --candidate-report "$QA_ROOT/reference-validation-v2.json" \
            --reference-root data/generated-v2 \
            --reference-manifest data/manifests/shadow-dance-v2.json \
            --reference-report results/reference-validation-v2.json \
            --csv-atol 1e-3 \
            --atol 1e-5
          for split in train heldout preflight test; do
            cmp "data/splits-v2/${split}.txt" "$QA_ROOT/splits-v2/${split}.txt"
          done

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-validation
          path: |
            ${{ runner.temp }}/shadow-qa/reference-validation-v2.json
            ${{ runner.temp }}/shadow-qa/sonic-assets.json
            ${{ runner.temp }}/shadow-qa/manifests
            ${{ runner.temp }}/shadow-qa/splits-v2
            ${{ runner.temp }}/shadow-qa/generated-v2
          if-no-files-found: warn
