[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-dance"
version = "0.1.0"
description = "Reproducible motion-data and evaluation tools for the SuperSONIC Shadow Partner Dip"
requires-python = ">=3.11"
dependencies = [
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "joblib>=1.4,<2",
  "mujoco>=3.3,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]
onnx = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]
publish = [
  "huggingface-hub>=1.0,<2",
]

[project.scripts]
shadow-generate = "shadow_dance.cli:generate_main"
shadow-validate = "shadow_dance.cli:validate_main"
shadow-render = "shadow_dance.cli:render_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
