# Single RTX PRO 6000 Kubernetes job for stock baseline, checkpoint ladder,
# evaluation, render, and export. The active SONIC runtime-fetch image is public on
# GHCR and contains no Isaac bytes; Isaac is acquired only after the entrant's explicit
# run-scoped NVIDIA acceptance described in the runbook.
name: shadow-dance-supersonic
resources:
  cloud: kubernetes
  accelerators: RTXPRO-6000-BLACKWELL-SERVER-EDITION:1
  cpus: 16
  memory: 64
  image_id: docker:${POLICY_IMAGE}
envs:
  # Supply the digest-pinned public GHCR image through --image and --var at launch.
  POLICY_IMAGE: ${POLICY_IMAGE}
  SONIC_PAYLOAD_MODE: direct
  SONIC_GPU_TYPE: gpu-rtx6000
  SONIC_IMAGE_VARIANT: sonic-k8s-host-mounted
  SUBMISSION_REPO: https://github.com/cristpierce/shadow-dance.git
  SUBMISSION_COMMIT: ${SUBMISSION_COMMIT}
  RUN_ID: ${RUN_ID}
  EVIDENCE_S3_URI: ${EVIDENCE_S3_URI}
  LOCAL_ONLY: "0"
  LADDER: 5,250,500,2000,4000
  STAGE_WALLTIME_BUDGET_SECONDS: 5:900,250:1800,500:3600,2000:12600,4000:21600
  TRAINING_TIMEOUT_SECONDS: 5:600,250:1500,500:3000,2000:10800,4000:19800
  SUBMISSION_DEADLINE_UTC: "2026-08-17T06:59:00Z"
  FINALIZATION_RESERVE_SECONDS: "7200"
  PORTAL_RESERVE_SECONDS: "2700"
  MAX_WALLTIME_SECONDS: "36000"
  FINAL_TEST_SEEDS: 101,202,303
  MAX_WALLTIME: 10h
  SMOKE_NUM_ENVS: "64"
  MAIN_NUM_ENVS: "512"
  TRAIN_SEED: "42"
  LEARNING_RATE: "2e-5"
  REGULAR_SAVE_FREQUENCY: "1000000"
  SAVE_LAST_FREQUENCY: "5"
  RENDER_SEED: "303"
  HF_MODEL_REPO: ${HF_MODEL_REPO}
  HF_DATASET_REPO: cristpierce/shadow-dance-v2
  ENTRANT_NVIDIA_EULA_ACCEPTED: ${ENTRANT_NVIDIA_EULA_ACCEPTED}
  ACCEPT_EULA: ${ACCEPT_EULA}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
setup: |
  set -euo pipefail
  command -v git >/dev/null
  project_dir="${HOME}/shadow-dance"
  if [ ! -d "${project_dir}/.git" ]; then
    git clone "${SUBMISSION_REPO}" "${project_dir}"
  fi
  cd "${project_dir}"
  git fetch origin "${SUBMISSION_COMMIT}"
  git checkout --detach "${SUBMISSION_COMMIT}"
  test "$(git rev-parse HEAD)" = "${SUBMISSION_COMMIT}"
  test "${SONIC_REPO_REF:-}" = 0a87181c9106d0e49293400714b157676e0ec664
  test "${NPA_IMAGE_PYTHON:-}" = /opt/npa/venv/bin/python
  test "${LOCAL_ONLY:-}" = 0
  "${NPA_IMAGE_PYTHON}" -c 'import boto3, huggingface_hub, imageio, numpy, onnx, PIL'
  "${NPA_IMAGE_PYTHON}" scripts/verify_dataset_bundle.py --profile dance-v2
run: |
  set -euo pipefail
  cd "${HOME}/shadow-dance"
  command -v timeout >/dev/null
  test -x /isaac-sim/python.sh
  test "${NPA_IMAGE_PYTHON:-}" = /opt/npa/venv/bin/python
  test "${LOCAL_ONLY:-}" = 0
  test -x "${NPA_IMAGE_PYTHON}"
  export RUN_STARTED_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
  deadline_epoch="$(date -u -d "${SUBMISSION_DEADLINE_UTC}" +%s)"
  deadline_remaining_seconds="$((deadline_epoch - $(date -u +%s) - PORTAL_RESERVE_SECONDS))"
  if [ "${deadline_remaining_seconds}" -le 0 ]; then
    echo "The portal reserve has begun; refusing a run that cannot be submitted." >&2
    exit 4
  fi
  timeout --signal=TERM --kill-after=15m "${MAX_WALLTIME}" \
    timeout --signal=TERM --kill-after=15m "${deadline_remaining_seconds}s" \
      bash scripts/cloud_pipeline.sh
